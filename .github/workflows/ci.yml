name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test-only, POSTGRES_DB: resource_engine_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/resource_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.4", python-version: "3.12", enable-cache: true }
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - name: Frontend syntax check
        run: for f in frontend/*.js; do node --check "$f"; done
      - name: Docker build
        run: docker build -t resource-engine:ci .
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/bootstrap init -backend=false
      - run: terraform -chdir=infra/bootstrap validate
