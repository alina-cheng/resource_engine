[project]
name = "onedegree-resource-engine"
version = "0.2.0"
description = "One Degree HSDS resource engine and supervised maintenance"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4", "gunicorn>=23", "jsonschema[format-nongpl]>=4.23",
  "PyJWT[crypto]>=2.8", "pypdf>=4", "requests>=2.31", "boto3>=1.35",
  "psycopg[binary]>=3.2", "opensearch-py>=2.5", "tzdata>=2024.1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: integration checks requiring TEST_DATABASE_URL"]
